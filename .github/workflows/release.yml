name: Release

# Cut a release by pushing a tag:
#   git tag v1.3.4 && git push origin v1.3.4
#
# Produces a GitHub Release containing:
#   - Twitch-Live.zip        (minimal CWS zip: manifest.json at root + popup.html, src/, lib/, LICENSE)
# Release notes are extracted from the matching ## [X.Y.Z] section in CHANGELOG.md
# and published with generate_release_notes: true appended.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.3.4) — must match manifest.json'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag or input
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Validate tag and manifest version match
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 << 'PY'
          import json, pathlib, os, re, sys
          ver = os.environ["VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", ver):
              print(f"::error::Version '{ver}' is not semver x.y.z (tag must be vX.Y.Z)")
              sys.exit(1)
          m = json.loads(pathlib.Path("manifest.json").read_text())
          mver = m.get("version", "")
          if mver != ver:
              print(f"::error::manifest.json version '{mver}' does not match tag version '{ver}' — bump manifest.json first")
              sys.exit(1)
          print(f"version ok — {ver}")
          PY

      - name: Validate CHANGELOG has an entry for this version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section — add one before tagging"
            exit 1
          fi
          echo "CHANGELOG entry found for $VERSION"

      - name: Build CWS zip (debug code stripped)
        run: |
          set -e
          rm -f Twitch-Live.zip
          rm -rf /tmp/store-build
          # Stage a store-ready copy: drops src/js/debug.js + src/css/debug.css
          # and strips DEBUG-START/END blocks and dbg() call sites (build/strip-debug.py).
          python3 build/strip-debug.py . /tmp/store-build
          # Sanity: every staged script must still parse
          for js in $(cd /tmp/store-build && find src lib -name "*.js"); do
            node --check "/tmp/store-build/$js"
          done
          cd /tmp/store-build
          zip -r "$OLDPWD/Twitch-Live.zip" manifest.json popup.html src/ lib/ LICENSE -x "*.DS_Store*"
          cd "$OLDPWD"
          echo "zip contents:"
          unzip -l Twitch-Live.zip | head -40
          ls -lh Twitch-Live.zip
          # Verify manifest is at zip root (CWS will reject otherwise)
          if ! unzip -l Twitch-Live.zip | grep -q " manifest.json"; then
            echo "::error::manifest.json not at zip root — check zip paths"
            exit 1
          fi
          # Verify no debug code shipped in the store build
          if unzip -l Twitch-Live.zip | grep -q "debug\.js\|debug\.css"; then
            echo "::error::debug-only files present in store zip"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Failed to extract release notes for $VERSION from CHANGELOG.md"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md
          echo "---------------------"

      - name: Update store listing What's-new
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -e
          # Refresh the What's-new block in store/listing.md and push it to
          # main (releases are cut from main, so checkout may be a tag).
          # Runs BEFORE the GitHub Release is created: if the push fails,
          # re-run the workflow instead of shipping a half-done release.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          python3 build/update-store-listing.py "$VERSION" release-notes.md store/listing.md
          git add store/listing.md
          if git diff --cached --quiet; then
            echo "store listing already current for v$VERSION"
          else
            git commit -m "docs(store): update What's new for v$VERSION"
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then
                break
              elif [ "$i" = 3 ]; then
                echo "::error::failed to push store listing update to main"
                exit 1
              fi
              sleep 5
            done
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            Twitch-Live.zip

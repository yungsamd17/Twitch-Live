name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest.json is valid JSON
        run: python3 -m json.tool manifest.json > /dev/null

      - name: Validate version is semver and required fields exist
        run: |
          python3 << 'PY'
          import json, re, sys, pathlib
          m = json.loads(pathlib.Path("manifest.json").read_text())
          ver = m.get("version", "")
          if not re.fullmatch(r"\d+\.\d+\.\d+", ver):
              print(f"::error::manifest.json version '{ver}' is not semver x.y.z")
              sys.exit(1)
          for field in ("manifest_version", "name", "version", "icons", "permissions", "background", "action"):
              if field not in m:
                  print(f"::error::manifest.json missing required field: {field}")
                  sys.exit(1)
          if m.get("manifest_version") != 3:
              print(f"::error::manifest_version must be 3, got {m.get('manifest_version')}")
              sys.exit(1)
          print(f"manifest ok — version {ver}")
          PY

      - name: Check required extension files exist
        run: |
          set -e
          for f in manifest.json popup.html src/js/background.js src/js/main.js src/js/settings.js src/js/util.js src/js/debug.js src/css/main.css src/css/debug.css src/icons/icon-16.png src/icons/icon-48.png src/icons/icon-128.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Verify store build strips debug code
        run: |
          set -e
          rm -rf /tmp/store-build-check
          # Fails on unbalanced markers or leftover debug references
          python3 build/strip-debug.py . /tmp/store-build-check
          for js in $(cd /tmp/store-build-check && find src lib -name "*.js"); do
            node --check "/tmp/store-build-check/$js"
          done
          echo "store build clean — no debug code, all scripts parse"

      - name: Verify store listing updater
        run: |
          set -e
          python3 build/update-store-listing.py --check store/listing.txt
          # Dry-run render on a temp copy with the current manifest version
          cp store/listing.txt /tmp/listing-check.md
          VER=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          python3 - <<'PY' > /tmp/check-notes.md
          import re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text()
          notes = "check notes"
          for m in re.finditer(r"^## \[[^\]]+\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S):
              if m.group(1).strip():
                  notes = m.group(1).strip()
                  break
          print(notes)
          PY
          python3 build/update-store-listing.py "$VER" /tmp/check-notes.md /tmp/listing-check.md
          grep -q "WHAT'S NEW IN v$VER" /tmp/listing-check.md
          echo "store listing updater ok"

      - name: Build CWS zip (dry-run)
        run: |
          set -e
          zip -r /tmp/Twitch-Live.zip manifest.json popup.html src/ lib/ LICENSE -x "*.DS_Store*"
          echo "zip contents:"
          unzip -l /tmp/Twitch-Live.zip | head -40
          # Ensure manifest is at the zip root (CWS requirement)
          if ! unzip -l /tmp/Twitch-Live.zip | grep -q " manifest.json"; then
            echo "::error::manifest.json not at zip root"
            exit 1
          fi
          echo "zip ok — $(du -h /tmp/Twitch-Live.zip | cut -f1)"
